<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVANE Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f2ed;color:#171717}
header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:4px;font-size:24px}.wrap{max-width:1100px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#111;color:#fff;white-space:nowrap}
.tabs button{background:#ddd;color:#111}.tabs button.on{background:#111;color:#fff}.card{background:#fff;border:1px solid #e4ddd3;border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{font-size:24px;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{padding:10px;border:1px solid #ccc;border-radius:9px;min-width:120px;flex:1}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}.page{display:none}.page.on{display:block}.gold{background:#b08a52}.bad{background:#8d3333}
.muted{color:#777;font-size:12px}#sync{position:fixed;left:10px;bottom:10px;background:#111;color:#fff;padding:8px 12px;border-radius:20px;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:11px}.wrap{padding:10px}}
</style>
</head>
<body>
<header><div class="brand">LEVANE</div><div>الإدارة والحسابات</div></header>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<section id="dash" class="page on"><div class="grid" id="metrics"></div></section>
<section id="sales" class="page">
<div class="card"><h3>إضافة مبيعة</h3><div class="row">
<input id="sc" placeholder="الزبون"><input id="sp" placeholder="العطر"><input id="sq" type="number" value="1" placeholder="العدد"><input id="spr" type="number" placeholder="سعر الوحدة">
<button class="btn gold" onclick="addSale()">حفظ</button></div></div>
<div class="card"><table><thead><tr><th>التاريخ</th><th>الزبون</th><th>العطر</th><th>العدد</th><th>الإجمالي</th><th></th></tr></thead><tbody id="salesBody"></tbody></table></div>
</section>
<section id="stock" class="page">
<div class="card"><h3>إضافة مخزون</h3><div class="row">
<input id="inm" placeholder="اسم المادة / العطر"><input id="icd" placeholder="الكود"><input id="iq" type="number" placeholder="الكمية"><input id="ico" type="number" placeholder="تكلفة الوحدة">
<button class="btn gold" onclick="addStock()">إضافة</button></div></div>
<div class="card"><table><thead><tr><th>الاسم</th><th>الكود</th><th>الكمية</th><th>التكلفة</th><th>القيمة</th><th></th></tr></thead><tbody id="stockBody"></tbody></table></div>
</section>
<section id="expenses" class="page">
<div class="card"><h3>إضافة مصروف</h3><div class="row"><input id="ed" placeholder="الوصف"><input id="ea" type="number" placeholder="المبلغ"><button class="btn gold" onclick="addExpense()">حفظ</button></div></div>
<div class="card"><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>المبلغ</th><th></th></tr></thead><tbody id="expBody"></tbody></table></div>
</section>
<section id="backup" class="page"><div class="card"><h3>نسخة احتياطية</h3><button class="btn" onclick="backup()">تنزيل JSON</button><p class="muted">النظام يحفظ نسخة محلية على الجهاز. يمكن ربط قاعدة البيانات المشتركة لاحقاً.</p></div></section>
</div>
<div id="sync">LEVANE ✓</div>
<script>
let db=JSON.parse(localStorage.getItem('levaneData')||'{"sales":[],"inventory":[],"expenses":[]}');
const tabsData=[['dash','لوحة التحكم'],['sales','المبيعات'],['stock','المخزون'],['expenses','المصاريف'],['backup','نسخة احتياطية']];
const tabs=document.getElementById('tabs');
tabsData.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[1];if(!i)b.className='on';b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(x[0]).classList.add('on');document.querySelectorAll('#tabs button').forEach(z=>z.classList.remove('on'));b.classList.add('on')};tabs.appendChild(b)});
const n=x=>Number(x)||0, money=x=>n(x).toLocaleString('en-US')+' د.ع', dt=()=>new Date().toLocaleString('en-GB');
function save(){localStorage.setItem('levaneData',JSON.stringify(db));render()}
function addSale(){if(!sc.value||!sp.value||n(sq.value)<=0)return alert('أدخل بيانات المبيعة');db.sales.push({id:Date.now(),date:dt(),customer:sc.value,perfume:sp.value,qty:n(sq.value),price:n(spr.value)});sc.value=sp.value='';sq.value=1;spr.value='';save()}
function addStock(){if(!inm.value||n(iq.value)<=0)return alert('أدخل بيانات المخزون');db.inventory.push({id:Date.now(),name:inm.value,code:icd.value,qty:n(iq.value),cost:n(ico.value)});inm.value=icd.value=iq.value=ico.value='';save()}
function addExpense(){if(!ed.value||n(ea.value)<=0)return alert('أدخل المصروف');db.expenses.push({id:Date.now(),date:dt(),desc:ed.value,amount:n(ea.value)});ed.value=ea.value='';save()}
function del(k,id){if(confirm('حذف؟')){db[k]=db[k].filter(x=>x.id!==id);save()}}
function render(){
let total=db.sales.reduce((s,x)=>s+n(x.qty)*n(x.price),0),ex=db.expenses.reduce((s,x)=>s+n(x.amount),0),stock=db.inventory.reduce((s,x)=>s+n(x.qty)*n(x.cost),0);
metrics.innerHTML=[['المبيعات',money(total)],['المصاريف',money(ex)],['قيمة المخزون',money(stock)],['الصافي',money(total-ex)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('');
salesBody.innerHTML=db.sales.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+x.customer+'</td><td>'+x.perfume+'</td><td>'+x.qty+'</td><td>'+money(x.qty*x.price)+'</td><td><button class="btn bad" onclick="del(\'sales\','+x.id+')">حذف</button></td></tr>').join('');
stockBody.innerHTML=db.inventory.map(x=>'<tr><td>'+x.name+'</td><td>'+x.code+'</td><td>'+x.qty+'</td><td>'+money(x.cost)+'</td><td>'+money(x.qty*x.cost)+'</td><td><button class="btn bad" onclick="del(\'inventory\','+x.id+')">حذف</button></td></tr>').join('');
expBody.innerHTML=db.expenses.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+x.desc+'</td><td>'+money(x.amount)+'</td><td><button class="btn bad" onclick="del(\'expenses\','+x.id+')">حذف</button></td></tr>').join('');
}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='levane-backup.json';a.click()}
render();
</script>
</body></html>
